<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cashly - Modern Digital Banking{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        secondary: '#374151',
                        accent: '#10b981',
                        silver: '#f8fafc',
                        dark: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        }
    </style>
</head>
<body class="bg-silver">
    {% if not hide_navigation %}
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="{% url 'home' %}" class="flex items-center space-x-3">
                    <div class="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center">
                        <i class="fas fa-coins text-white text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold text-dark">Cashly</span>
                </a>
                
                <div class="flex items-center space-x-4">
                    <a href="{% url 'home' %}" class="text-secondary hover:text-primary font-medium">
                        <i class="fas fa-home mr-1"></i>Home
                    </a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    {% block content %}
    {% endblock %}

    <!-- Simple Footer for Auth Pages -->
    {% if not hide_navigation %}
    <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-6 py-6">
            <div class="text-center text-secondary">
                <p>&copy; 2024 Cashly. Built by Dev_Catalyst.</p>
                <div class="flex justify-center space-x-4 mt-2 text-xs">
                    <a href="#" class="hover:text-primary">Privacy Policy</a>
                    <a href="#" class="hover:text-primary">Terms of Service</a>
                    <a href="#" class="hover:text-primary">Security</a>
                </div>
            </div>
        </div>
    </footer>
    {% endif %}
    
</body>
</html>
